name: Build APK

on:
  push:
    branches: [main, online]
    paths: ['android/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle test --no-daemon

      # Один и тот же ключ на все сборки, иначе Android не ставит обновление поверх старой версии.
      - name: Restore debug keystore
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "Секрет DEBUG_KEYSTORE_B64 не задан"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/debug.p12"

      - name: Build debug APK
        env:
          PROTOCOL_KEYSTORE: ${{ runner.temp }}/debug.p12
          PROTOCOL_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk protocol-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-debug
          path: android/protocol-debug.apk

      # Скользящий пре-релиз: APK можно скачать с телефона без входа в GitHub.
      # main → latest-debug, другие ветки → latest-<ветка>.
      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then TAG=latest-debug; else TAG="latest-$BRANCH"; fi
          git tag -f "$TAG"
          git push -f origin "$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "Debug build ($BRANCH)" --notes "Автосборка из $BRANCH. Подпись debug."
          gh release upload "$TAG" protocol-debug.apk --clobber
